apiVersion: batch/v1
kind: CronJob
metadata:
  name: unseal-vault-job
  namespace: vault
  annotations:
    argocd.argoproj.io/sync-wave: "25"
spec:
  schedule: "*/5 * * * *"
  timezone: "Etc/UTC"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 10
  successfulJobsHistoryLimit: 10
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 10
      activeDeadlineSeconds: 600
      template:
        spec:
          containers:
          - name: vault-monitor
            image: hashicorp/vault:1.18.1
            envFrom:
            - configMapRef:
                name: vault-config-map
            - secretRef:
                name: vault-init-log
            command:
            - /bin/sh
            - -c
            - |
              echo "vault-monitor ..."
              KEYS="$UNSEAL_KEY_1 $UNSEAL_KEY_2 $UNSEAL_KEY_3 $UNSEAL_KEY_4 $UNSEAL_KEY_5"

              join_raft_node() {
                  # Join Raft Node
                  echo "Join Raft Node $VAULT_ADDR..."
                  echo MASTER_VAULT_ADDR: $MASTER_VAULT_ADDR
                  while true; do
                      vault operator raft join $MASTER_VAULT_ADDR
                      retval=$?
                      if [ $retval -eq 0 ]; then
                          vault status
                          break;
                      fi
                      sleep 5
                  done
                  echo "Joinned Raft Node $VAULT_ADDR..."
                  echo "==="
              }


              unseal_node() {
                  echo "Unsealing Vault $VAULT_ADDR..."
                  for KEY in $KEYS; do
                      while true; do
                          vault status 1>/dev/mill
                          RETVAL=$?
                          echo RETVAL: $RETVAL
                          if [ $RETVAL -eq 0 ]; then
                              echo "Vault is already unsealed."
                              return 0;
                          elif [ $RETVAL -eq 2 ]; then
                              vault operator unseal $KEY # 1>/dev/mill
                              U_RETVAL=$?
                              echo "opertor unseal: " $U_RETVAL
                              break;
                          fi
                          sleep 5
                      done
                      sleep 2
                      echo "************************"
                  done
                  echo "Unseal complete $VAULT_ADDR..."
              }

              MASTER_VAULT_ADDR=$VAULT_ADDR
              for i in $(seq 0 $(($NUM_OF_NODES - 1))); do
                  POD_NAME=vault-$i
                  echo " "
                  echo "====> Unseal $POD_NAME"
                  export VAULT_ADDR="http://$POD_NAME.vault-internal:8200"
                  echo $VAULT_ADDR
                  echo $VAULT_TOKEN
                  if [ $i -ne 0 ]; then
                    join_raft_node
                  fi
                  unseal_node
              done

          restartPolicy: Never